# UrbanFlow au complet : l'application, son API et le moteur d'itinéraires.
#
# Le même serveur porte le client et l'API — une seule origine, donc un cookie
# de session de première partie et aucun en-tête CORS.
#
# Il écoute en **HTTPS**, et ce n'est pas une précaution de production : le
# navigateur reserve au contexte securise la géolocalisation,
# `crypto.randomUUID` et le service worker. Sans lui l'application ne
# fonctionne que sur localhost, donc pas depuis un téléphone.
#
#   docker compose -f infra/compose.yml up -d
#
# Le moteur exige un préalable : ./infra/motis-prepare.sh, qui télécharge la
# voirie puis construit le graphe (horaires désactivés par défaut) dans motis-data/data. Sans
# lui, le service motis démarre puis s'arrête faute de jeu de données.
services:
  app:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      # Le moteur est visé par son nom de service : le réseau du compose fait
      # la résolution, aucun port MOTIS n'a besoin d'être publié.
      TEST_PASSWORD: ${TEST_PASSWORD:-UrbanFlow2026!}
      MOTIS_URL: http://motis:8080
      MOTIS_TRANSIT_ENABLED: ${MOTIS_TRANSIT_ENABLED:-false}
      # Adresses supplémentaires à inscrire dans le certificat. Renseigner l'IP
      # de la machine sur le réseau local pour y accéder depuis un téléphone :
      #   TLS_EXTRA_HOSTS=IP:192.168.1.37
      TLS_EXTRA_HOSTS: ${TLS_EXTRA_HOSTS:-}
    volumes:
      - app-data:/data
      - app-certs:/certs
    # Publie sur toutes les interfaces : sinon le téléphone ne verrait rien.
    ports:
      - '4000:4000'
    depends_on: [motis]
    restart: unless-stopped

  # MOTIS calcule sur un graphe unique : voirie OSM (accès à pied, à vélo et
  # référence voiture), horaires GTFS (RAPTOR) et flux GBFS lus à l'exécution.
  motis:
    image: ghcr.io/motis-project/motis@sha256:6055f51eec43eeed28524037ca0161b96efe9cd05728eaa9ac04c20c2826d330
    command: /motis server -d /data/data
    working_dir: /data
    volumes:
      - ./motis-data:/data
    restart: unless-stopped

volumes:
  app-data:
  app-certs:
