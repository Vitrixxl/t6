# UrbanFlow au complet : l'application, son API et le calculateur d'itinéraires.
#
# Le même serveur porte le client et l'API — une seule origine, donc un cookie
# de session de première partie et aucun en-tête CORS.
#
# Il écoute en **HTTPS**, et ce n'est pas une précaution de production : le
# navigateur reserve au contexte securise la géolocalisation,
# `crypto.randomUUID` et le service worker. Sans lui l'application ne
# fonctionne que sur localhost, donc pas depuis un téléphone.
#
#   docker compose -f infra/compose.yml up -d
#
# Le calculateur exige un préalable : ./infra/osrm-prepare.sh, qui telecharge
# les données et construit les trois index. Sans lui, les services osrm-*
# démarrent puis s'arrêtent faute de jeu de données.
services:
  app:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      # Le calculateur est vise par son nom de service : le réseau du compose
      # fait la résolution, aucun port OSRM n'a besoin d'être publie.
      OSRM_BASE_URL: http://osrm:5000
      # Adresses supplémentaires a inscrire dans le certificat. Renseigner l'IP
      # de la machine sur le réseau local pour y accéder depuis un téléphone :
      #   TLS_EXTRA_HOSTS=IP:192.168.1.37
      TLS_EXTRA_HOSTS: ${TLS_EXTRA_HOSTS:-}
    volumes:
      - app-data:/data
      - app-certs:/certs
    # Publie sur toutes les interfaces : sinon le téléphone ne verrait rien.
    ports:
      - '4000:4000'
    depends_on: [osrm]
    restart: unless-stopped

  # OSRM ne sait servir qu'un profil à la fois : les règles de circulation
  # différent selon le mode sur une même rue, et elles sont gravees dans l'index
  # au prétraitement. D'où trois moteurs, regroupés derrière une façade qui
  # reproduit les chemins de l'instance publique.
  osrm:
    image: docker.io/library/caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./osrm-proxy.Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [osrm-foot, osrm-bike, osrm-car]
    restart: unless-stopped

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-foot.osrm
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-bike.osrm
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped

  # La voiture n'est jamais proposée. Ce profil ne sert qu'à mesurer une fois
  # le scénario de référence carbone entre le départ et l'arrivée.
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-car.osrm
    volumes:
      - ./osrm-data:/data
    restart: unless-stopped

volumes:
  app-data:
  app-certs:
