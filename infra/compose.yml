# Pile serveur d'UrbanFlow : l'API et le calculateur d'itineraires.
#
# Le client n'y figure pas. En developpement il tourne sous Vite, en production
# c'est un build statique : l'emballer n'apporterait rien et brouillerait le
# message d'une application qui reste une PWA.
#
#   podman compose -f infra/compose.yml up -d      (ou docker compose)
#
# Le calculateur exige un prealable : ./infra/osrm-prepare.sh, qui telecharge
# les donnees et construit les trois index. Sans lui, les services osrm-*
# demarrent puis s'arretent faute de jeu de donnees.
services:
  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      # L'API vise la facade interne : le nom de service suffit, le reseau du
      # compose fait la resolution. Aucun port OSRM n'a besoin d'etre publie.
      OSRM_BASE_URL: http://osrm:5000
    volumes:
      - api-data:/data
    ports:
      - '127.0.0.1:4000:4000'
    depends_on: [osrm]
    restart: unless-stopped

  # OSRM ne sait servir qu'un profil a la fois : les regles de circulation
  # different selon le mode sur une meme rue, et elles sont gravees dans l'index
  # au pretraitement. D'ou trois moteurs, regroupes derriere une facade qui
  # reproduit les chemins de l'instance publique.
  osrm:
    image: docker.io/library/caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./osrm-proxy.Caddyfile:/etc/caddy/Caddyfile:ro,z
    depends_on: [osrm-foot, osrm-bike, osrm-car]
    restart: unless-stopped

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-foot.osrm
    volumes:
      - ./osrm-data:/data:z
    restart: unless-stopped

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-bike.osrm
    volumes:
      - ./osrm-data:/data:z
    restart: unless-stopped

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-car.osrm
    volumes:
      - ./osrm-data:/data:z
    restart: unless-stopped

volumes:
  api-data:
