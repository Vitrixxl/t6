# Calculateur d'itineraires auto-heberge.
#
# OSRM prepare un jeu de donnees par profil : marche, velo et voiture n'ont pas
# les memes regles sur les memes rues (sens uniques, escaliers, zones
# pietonnes). Ils ne peuvent donc pas partager un index, d'ou trois services.
#
# La facade les regroupe derriere un seul port, avec les memes chemins que
# l'instance publique. Une seule variable suffit alors cote application :
#   OSRM_BASE_URL=http://127.0.0.1:5000
#
# Preparation des donnees : ./infra/osrm-prepare.sh
services:
  proxy:
    image: docker.io/library/caddy:2-alpine
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - ./osrm-proxy.Caddyfile:/etc/caddy/Caddyfile:ro,z
    ports:
      - '127.0.0.1:5000:5000'
    depends_on: [osrm-foot, osrm-bike, osrm-car]
    restart: unless-stopped

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-foot.osrm
    volumes:
      - ./osrm-data:/data:z
    restart: unless-stopped

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-bike.osrm
    volumes:
      - ./osrm-data:/data:z
    restart: unless-stopped

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-car.osrm
    volumes:
      - ./osrm-data:/data:z
    restart: unless-stopped
