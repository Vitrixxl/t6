# Calculateur d'itineraires auto-heberge.
#
# OSRM prepare un jeu de donnees par profil : marche, velo et voiture n'ont pas
# les memes regles sur les memes rues (sens uniques, escaliers, zones
# pietonnes). Ils ne peuvent donc pas partager un index, d'ou trois services.
#
# Les chemins des profils reproduisent ceux de l'instance publique
# (/routed-foot/, /routed-bike/, /routed-car/) : un reverse proxy devant ces
# trois ports suffit pour que OSRM_BASE_URL pointe sur une seule racine.
# En developpement, on peut aussi viser directement un port.
#
# Preparation des donnees : voir infra/osrm-prepare.sh
services:
  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-foot.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - '5001:5000'
    restart: unless-stopped

  osrm-bike:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-bike.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - '5002:5000'
    restart: unless-stopped

  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:latest
    command: osrm-routed --algorithm mld /data/lyon-car.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - '5003:5000'
    restart: unless-stopped
