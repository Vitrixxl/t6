# Note sur le rechargement à chaud du client.
#
# Bun sait le faire — `Bun.serve` avec des routes HTML et `development.hmr` —
# et Elysia transmet bien ces routes : vérifie, l'API et le regroupement à la
# volée coexistent. Le blocage est ailleurs : le document référence le manifeste
# et les icônes par chemin absolu, ce qui demande un greffon de résolution, et
# declarer ce greffon sous `[serve.static]` fait planter Bun 1.4.0.
#
# Le développement reconstruit donc le client à chaque modification, en moins
# d'une seconde, et la page se rafraîchit à la main. A reprendre quand Bun aura
# corrige, ou si le document cesse de referencer des chemins absolus.
