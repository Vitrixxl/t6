name: CI

# Chaine de verification bloquante : lint + tests unitaires + build de
# production (equivalent de `npm run check`), puis audit d'accessibilite
# axe-core et scenario E2E de navigation executes contre le build servi.
# Aucun increment ne peut etre fusionne si un de ces controles echoue.
# Le banc de performance est journalise a titre indicatif (les temps
# dependent du runner) sans bloquer la fusion.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Analyse statique (ESLint)
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm run test

      - name: Build de production (TypeScript + Vite)
        run: npm run build

      - name: Metriques du build (tailles gzip des artefacts)
        run: npm run metrics:build

      - name: Servir le build de production
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && break
            sleep 1
          done

      - name: Audit accessibilite axe-core (WCAG 2.1 A/AA, bloquant)
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run audit:a11y

      - name: Scenario E2E planification (5 assertions bloquantes)
        env:
          CHROME_BIN: /usr/bin/google-chrome
          E2E_BASE_URL: http://localhost:4173
        run: |
          mkdir -p tmp/screenshots
          npm run e2e

      - name: Banc de performance (indicatif, non bloquant)
        continue-on-error: true
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: npm run bench:perf
