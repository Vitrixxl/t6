name: CI

# Une seule recette, exécutée à l’identique avant push et sur GitHub.
# Elle prépare son moteur MOTIS à partir d’un extrait OSM et d’un horaire GTFS
# de recette versionnés, vérifie sa disponibilité et utilise une base SQLite neuve.
# BAN, GBFS, tuiles et CDN Scalar restent des services externes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Vérification complète
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Localiser le navigateur
        run: |
          for candidate in google-chrome chromium chromium-browser; do
            path=$(command -v "$candidate" || true)
            if [ -n "$path" ]; then
              echo "CHROME_BIN=$path" >> "$GITHUB_ENV"
              echo "Navigateur retenu : $path"
              exit 0
            fi
          done
          echo "Aucun navigateur trouvé sur le runner." >&2
          exit 1

      - name: Recette complète (qualité, MOTIS, accessibilité et navigateur)
        run: bun run ci

      - name: Conserver les diagnostics en cas d’échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-echec
          path: |
            tmp/screenshots/
            tmp/ci/*.log
          if-no-files-found: ignore

  compose:
    name: Pile Docker complète
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      # L'horaire de recette tient lieu d'archive TCL : le chemin avec horaires
      # est ainsi vérifié sans l'archive officielle, jamais versionnée.
      - name: Déposer l’horaire de recette
        run: cp scripts/fixtures/lyon-ci.gtfs.zip infra/gtfs/tcl.gtfs.zip

      - name: Démarrer la pile comme sur une machine neuve
        env:
          MOTIS_TRANSIT_ENABLED: 'true'
        run: docker compose up --build --wait --wait-timeout 1200

      - name: Vérifier l’application et le moteur
        run: |
          curl --fail --silent --show-error --insecure https://localhost:4000/api/health
          docker compose exec -T motis wget -qO- 'http://127.0.0.1:8080/api/v6/plan?fromPlace=45.7578,4.832&toPlace=45.76,4.85' > /dev/null

      - name: Journaux en cas d’échec
        if: failure()
        run: docker compose logs

      - name: Arrêter la pile
        if: always()
        run: docker compose down --volumes
