# UrbanFlow au complet : l'entrée HTTPS, l'application avec son API, et le
# moteur d'itinéraires.
#
#   docker compose up
#
# Rien à préparer avant : au premier démarrage, le moteur construit son graphe
# dans un volume à partir de la voirie et des horaires TCL versionnés
# (voir infra/motis-entrypoint.sh). L'application attend qu'il réponde, puis
# Caddy la publie sur https://localhost (ou https://$DOMAIN) avec redirection
# de HTTP vers HTTPS.
#
# Le même serveur porte le client et l'API — une seule origine, donc un cookie
# de session de première partie et aucun en-tête CORS. HTTPS n'est pas une
# précaution de production : le navigateur réserve au contexte sécurisé la
# géolocalisation, `crypto.randomUUID` et le service worker. Avec un nom
# public dans DOMAIN, Caddy obtient un certificat Let's Encrypt reconnu
# partout, téléphone compris.
#
# Les réglages facultatifs se lisent dans un fichier .env à la racine
# (modèle : .env.example). Aucun n'est nécessaire pour démarrer.
name: urbanflow

services:
  # Seul service publié : termine TLS et transmet à l'application.
  proxy:
    image: caddy@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificats et clés de compte Let's Encrypt : à conserver, sinon
      # chaque recréation redemande un certificat et épuise le quota.
      - proxy-data:/data
    # Publié sur toutes les interfaces : sinon le téléphone ne verrait rien.
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      # Le moteur est visé par son nom de service : le réseau du compose fait
      # la résolution, aucun port MOTIS n'a besoin d'être publié.
      MOTIS_URL: http://motis:8080
      MOTIS_TRANSIT_ENABLED: ${MOTIS_TRANSIT_ENABLED:-true}
      TEST_PASSWORD: ${TEST_PASSWORD:-UrbanFlow2026!}
      # Le proxy est le seul à joindre l'application : son X-Forwarded-For
      # est fiable et sert à la limitation de débit par adresse.
      TRUST_PROXY: 'true'
    volumes:
      # Comptes et trajets d'un côté, certificat interne de l'autre : le
      # conteneur reste jetable, les données survivent à sa recréation.
      - app-data:/data
      - app-certs:/certs
    depends_on:
      motis:
        condition: service_healthy
    restart: unless-stopped

  # MOTIS calcule sur un graphe unique : voirie OSM (accès à pied, à vélo et
  # référence voiture), horaires GTFS (RAPTOR) et flux GBFS lus à l'exécution.
  motis:
    image: ghcr.io/motis-project/motis@sha256:6055f51eec43eeed28524037ca0161b96efe9cd05728eaa9ac04c20c2826d330
    entrypoint: [/bin/sh, /motis-entrypoint.sh]
    environment:
      MOTIS_TRANSIT_ENABLED: ${MOTIS_TRANSIT_ENABLED:-true}
    volumes:
      - motis-data:/data
      - ./infra/motis-entrypoint.sh:/motis-entrypoint.sh:ro
      - ./infra/osm:/osm:ro
      - ./infra/gtfs:/gtfs:ro
    healthcheck:
      # Une vraie recherche à pied dans Lyon : le graphe est chargé et répond.
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:8080/api/v1/one-to-many?one=45.7578;4.832&many=45.76;4.85&mode=WALK&max=3600&maxMatchingDistance=250&arriveBy=false
      interval: 10s
      timeout: 5s
      retries: 3
      # Le premier démarrage construit le graphe.
      start_period: 10m
    restart: unless-stopped

volumes:
  proxy-data:
  app-data:
  app-certs:
  motis-data:
